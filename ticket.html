<!DOCTYPE html>
<html>

<head>
    <title>Ticket</title>
    <style>
        @page {
            size: 8in 3in;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            font-size: 8pt;
            line-height: 1.2;
            font-weight: bold;
        }

        .ticket {
            display: flex;
            width: 8in;
            height: 3in;
            border: 1px solid #000;
        }

        .left-col,
        .right-col {
            overflow: hidden;
        }

        .left-col {
            width: 2.45in;
            padding: 0.05in;
            border-right: 1px dashed #000;
            position: relative;
            transform: translate(0.06in, 0.13in);
        }

        .right-col {
            width: 5.45in;
            padding: 0.05in;
            /* margin-top: 0.6in; */
            position: relative;
            transform: translate(0.05in, 0.4in);
        }

        .field {
            position: absolute;
            font-weight: bold;
        }

        .logo {
            text-align: center;
            height: 0.4in;
            margin-bottom: 4px;
        }

        .logo img {
            max-height: 100%;
        }

        .section {
            margin: 14px 0;
        }

        .section label {
            font-weight: bold;
            display: inline-block;
            width: 1in;
        }

        .section span {
            display: inline-block;
        }

        .section span,
        .form-row span {
            font-weight: 900;
        }

        .form-row {
            display: flex;
            justify-content: space-around;
            margin: 14px 0;
            flex-wrap: wrap;
        }

        .left-table {
            margin-top: 5px;
        }

        .table-label {
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 2px;
            display: inline-block;
        }

        .tax-table,
        .tax-table-2 {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2px;
            font-size: 8pt;
            table-layout: fixed;
        }

        .tax-table td,
        .tax-table-2 td,
        .tax-table-2 th {
            border: 1px solid #000;
            padding: 2px;
            text-align: center;
            width: 16.6%;
        }

        .footer {
            font-size: 8pt;
            text-align: center;
            margin-top: 4px;
            border-top: 1px dashed #000;
            padding-top: 2px;
        }

        .price-value {
            font-weight: bold;
            font-size: 8pt;
            text-align: right;
            margin-top: 4px;
        }

        /* ------------  */

        .field-left-serial {
            top: 0.25in;
            left: 0.2in;
        }

        .field-left-movie {
            top: 0.5in;
            left: 0.2in;
        }

        .field-left-date {
            top: 0.8in;
            left: 0.1in;
        }

        .field-left-time {
            top: 0.8in;
            left: 1.3in;
        }

        .field-left-seat {
            top: 1.1in;
            left: 0.1in;
        }

        .field-left-type {
            top: 1.1in;
            left: 1.3in;
        }

        .field-left-adm {
            top: 1.5in;
            left: 0.2in;
        }

        .field-left-ac-e-m {
            top: 1.5in;
            left: 0.9in;
        }

        .field-left-total {
            top: 1.5in;
            left: 2.0in;
        }

        .field-left-vat {
            top: 0;
            left: 0;
        }

        .field-left-m-tax {
            top: 1.7in;
            left: 1.2in;
        }

        /* === RIGHT COLUMN FIELD POSITIONS === */
        .field-right-serial {
            top: 0.2in;
            left: 0.3in;
        }

        .field-right-date {
            top: 0.2in;
            left: 2.2in;
        }

        .field-right-time {
            top: 0.2in;
            left: 4.2in;
        }

        .field-right-movie {
            top: 0.5in;
            left: 0.3in;
        }

        .field-right-hall {
            top: 0.8in;
            left: 0.3in;
        }

        .field-right-type {
            top: 0.8in;
            left: 2.2in;
        }

        .field-right-seat {
            top: 0.8in;
            left: 4.2in;
        }

        .field-right-adm {
            top: 1.2in;
            left: 0.3in;
        }

        .field-right-ac-e-m {
            top: 1.2in;
            left: 1.0in;
        }

        .field-right-vat {
            top: 1.2in;
            left: 1.8in;
        }

        .field-right-m-tax {
            top: 1.2in;
            left: 2.6in;
        }

        .field-right-total {
            top: 1.2in;
            left: 4.2in;
        }

        /* PRINT RULES */
        @media print {

            html,
            body {
                width: 8in;
                height: 3in;
                margin: 0;
                padding: 0;
                overflow: hidden;
                /* border: 1px solid #000; */
            }

            .ticket {
                border: none;
                page-break-after: avoid;
                page-break-before: avoid;
            }

            .logo img {
                display: none;
            }

            .logo {
                height: 0.4in;
            }

            label {
                visibility: hidden;
            }

            .table-label {
                visibility: hidden;
            }

            /* Hide headers of both tables */
            .tax-table tr:first-child td,
            .tax-table-2 tr:first-child th {
                visibility: hidden;
            }

            /* Keep second row values visible (e.g. 120, 10, etc.) */
            .tax-table tr:nth-child(2) td,
            .tax-table-2 tr:nth-child(2) td {
                visibility: visible !important;
            }

            /* Make sure 43 and 23.11 are visible */
            .tax-table tr:nth-child(3) td div {
                visibility: visible;
            }

            /* Hide "VAT" and "M.Tax" text in left table's third row */
            .tax-table tr:nth-child(3) td div::first-line {
                visibility: hidden;
            }

            /* Optional: remove borders */
            .tax-table td,
            .tax-table-2 td,
            .tax-table-2 th {
                border: none !important;
            }

            .footer {
                visibility: hidden;
            }

            /* ------------- print ------------------ */
            /* left  */
            .left-col {
                border-right: none;
            }

            .field-left-serial {
                transform: translate(0.05in, 0.25in);
            }

            .field-left-movie {
                transform: translate(0.05in, 0.3in);
            }

            .section-left-seat {
                transform: translate(-0.05in, 0.5in);
            }

            .section-left-date {
                transform: translate(-0.05in, 0.45in);
            }



            /* right  */
            .right-col {
                transform: translate(0.05in, 0.5in);
            }

            .section-right-serial {
                transform: translate(-0.5in, 0.2in);
            }

            .section-right-movie {
                transform: translate(0.07in, 0.3in);
            }

            .section-right-hall {
                /* position: absolute; */
                transform: translate(-0.35in, 0.4in);
            }
        }
    </style>
</head>

<body>
    <div class="ticket">
        <!-- Left Column -->
        <div class="left-col">
            <div class="logo">
                <img src="https://www.shyamolicinema.com/assets/shymoliLogo-BawqTJOx.png" alt="Cinema Logo" />
            </div>
            <div class="section"><label>Serial:</label><span class="filed field-left-serial">#123456</span></div>
            <div class="section"><label>Movie:</label><span class="filed field-left-movie">Some Movie</span></div>
            <div class="form-row section-left-date">
                <div><label>Date:</label><span class="filed field-left-date">23/06/2025</span></div>
                <div><label>Time:</label><span class="filed field-left-time">7:30 PM</span></div>
            </div>
            <div class="form-row section-left-seat">
                <div><label>Seat:</label><span class="filed field-left-seat">B2</span></div>
                <div><label>Type:</label><span class="filed field-left-type">Premium</span></div>
            </div>

            <div class="form-row left-table">
                <div class="table-label">Price TK.</div>
                <table class="tax-table ">
                    <tr>
                        <td>ADM</td>
                        <td colspan="2">AC, E. Maintenance</td>
                        <td>Total</td>
                    </tr>
                    <tr>
                        <td class="filed field-left-adm">154</td>
                        <td colspan="2" class="filed field-left-ac-e-m">130</td>
                        <td rowspan="2" class="filed field-left-total">120</td>
                    </tr>
                    <tr>
                        <td>
                            <div>VAT<br class="filed field-left-vat">43</div>
                        </td>
                        <td>
                            <div>M.Tax<br class="filed field-left-m-tax">23.11</div>
                        </td>
                        <td></td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-col">
            <div class="logo">
                <img src="https://www.shyamolicinema.com/assets/shymoliLogo-BawqTJOx.png" alt="Cinema Logo" />
            </div>
            <div class="form-row section-right-serial">
                <div><label>Serial:</label><span class="filed field-right-serial">#123456</span></div>
                <div><label>Date:</label><span class="filed field-right-date">23/06/2025</span></div>
                <div><label>Time:</label><span class="filed field-right-time">7:30 PM</span></div>
            </div>
            <div class="section section-right-movie"><label>Movie:</label><span class="field-right-movie">Some
                    Movie</span></div>
            <div class="form-row section-right-hall">
                <div><label>Hall:</label><span class="filed field-right-hall">1</span></div>
                <div><label>Type:</label><span class="filed field-right-type">Premium</span></div>
                <div><label>Seat:</label><span class="filed field-right-seat">B2</span></div>
            </div>

            <div class="form-row">
                <div class="table-label">Price TK.</div>
                <table class="tax-table-2">
                    <tr>
                        <th>ADM</th>
                        <th>AC, E. Maintenance</th>
                        <th>VAT</th>
                        <th>M.Tax</th>
                        <th></th>
                        <th>Total</th>
                    </tr>
                    <tr>
                        <td class="filed field-right-adm">120</td>
                        <td class="filed field-right-ac-e-m">10</td>
                        <td class="filed field-right-vat">30</td>
                        <td class="filed field-right-m-tax">40</td>
                        <td></td>
                        <td class="filed field-right-total">70</td>
                    </tr>
                </table>
            </div>

            <div class="footer">
                Location: Shyamoli Cinema, Dhaka | Payment: Cash
            </div>
        </div>
    </div>
</body>

</html>
